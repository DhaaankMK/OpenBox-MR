name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy opencv-python-headless
      - run: python -m unittest discover -s OpenBox_Data/tests
      - run: python OpenBox_Data/tests/smoke_headless.py
      - run: python OpenBox_Data/tests/static_check.py
